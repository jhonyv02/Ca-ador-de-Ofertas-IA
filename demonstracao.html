<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Caçador de Ofertas IA — Prévia</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--card:#111a2b;--line:#27334b;--muted:#98a9be;--green:#3ce0a1}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Arial;color:#eff5fd;font-size:14px}button,input,select,textarea{font:inherit}button,a{cursor:pointer}a{color:inherit;text-decoration:none}button{border:0}.layout{display:flex;min-height:100vh}.side{width:250px;background:#0d1524;border-right:1px solid var(--line);padding:30px 15px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:9px;align-items:center;padding-left:9px}.brand-b{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#164e42;font-size:25px;color:var(--green)}.brand strong{font-size:18px}.brand strong b{color:var(--green)}.brand small{display:block;color:#9caabc;font-size:9px;letter-spacing:1px}.nav{display:grid;gap:6px}.nav button{width:100%;background:transparent;color:#9fb1c4;text-align:left;padding:14px;border-radius:10px;font-size:13px}.nav button.active,.nav button:hover{background:#173a37;color:var(--green)}.side-info{margin-top:auto;background:#142d30;border:1px solid #275a4d;border-radius:11px;padding:13px;color:#aecdc4;font-size:11px;line-height:1.6}.main{flex:1;min-width:0}.top{height:70px;padding:0 37px;border-bottom:1px solid #1c2b3e;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#9babbd}.content{padding:32px 37px 60px;max-width:1490px;margin:auto}.eyebrow{color:var(--green);letter-spacing:2px;font-size:10px;font-weight:850}.hrow{display:flex;justify-content:space-between;gap:14px;align-items:end;margin:12px 0 25px}.hrow h1{font-size:34px;letter-spacing:-1px;margin:0 0 8px}.muted{color:var(--muted)}.hrow p{font-size:13px;color:var(--muted);margin:0}.btn{border:1px solid #35465b;background:#1c2b40;color:#e7f4fa;border-radius:9px;padding:11px 15px;font-size:12px;font-weight:700;white-space:nowrap}.btn:hover{filter:brightness(1.2)}.primary{background:var(--green);border-color:var(--green);color:#063329}.danger{color:#ffb8c3;background:#432832;border-color:#693944}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat,.panel,.card{border:1px solid var(--line);border-radius:13px;background:var(--card)}.stat{padding:22px}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:27px;display:block;margin-top:12px}.stat .hint{font-size:10px;color:#7185a0;margin-top:7px}.panel{padding:21px;margin-bottom:19px}.panel h2{font-size:17px;margin:0 0 4px}.panel p.description{font-size:12px;color:var(--muted);margin:0 0 18px}.banner{border-radius:12px;border:1px solid #276450;background:linear-gradient(120deg,#164739,#112436);padding:22px 26px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.banner h3{margin:0 0 8px}.banner p{color:#b3cabc;font-size:12px;margin:0}.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}.flex{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:14px 0;gap:9px}.row:first-of-type{border-top:0}.row strong{font-size:13px}.row small{color:var(--muted);font-size:11px}.row .left{display:flex;gap:11px;align-items:center}.row .symbol{background:#153932;color:var(--green);width:37px;height:37px;border-radius:9px;display:grid;place-items:center}.score{background:#193b32;color:#61ecb0;padding:7px 10px;border-radius:8px;font-weight:850}.tag{font-size:10px;border:1px solid #36536d;border-radius:6px;background:#20344c;color:#b9d0e5;padding:5px 7px}.tag.green{background:#174638;border-color:#245944;color:#71f3b9}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{padding:18px;display:flex;flex-direction:column;gap:12px}.card h3{font-size:16px;margin:0}.card p{color:var(--muted);font-size:12px;line-height:1.55;margin:0;min-height:44px}.card .foot{border-top:1px solid var(--line);padding-top:13px;display:flex;justify-content:space-between;margin-top:auto;font-size:12px}.card .foot a{color:var(--green);font-weight:700}.toolbar{display:flex;gap:9px;margin-bottom:20px;flex-wrap:wrap}.input,.select,.area{background:#0c1626;border:1px solid #37465e;border-radius:8px;color:#ecf6fb;padding:12px;font-size:12px;outline:none}.input:focus,.select:focus,.area:focus{border-color:var(--green)}.input{flex:1;min-width:180px}.select{min-width:150px}.area{min-height:80px;resize:vertical}.field{display:grid;gap:6px;font-size:12px;font-weight:700}.field input,.field select,.field textarea{width:100%}.form{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full{grid-column:1/-1}.form-buttons{display:flex;justify-content:end;gap:9px;grid-column:1/-1;margin-top:8px}.adpic{height:142px;border:1px dashed #354960;background:#0c1726;border-radius:8px;display:grid;place-items:center;font-size:32px;color:#537492}.note{border:1px solid #34506a;background:#152a3b;border-radius:9px;padding:15px;line-height:1.6;font-size:12px;color:#aec8dc}.empty{text-align:center;padding:46px 16px;color:var(--muted)}.empty strong{display:block;color:white;margin-bottom:9px}.overlay{position:fixed;inset:0;background:#000c;z-index:40;display:grid;place-items:center;padding:12px}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:#111e30;border:1px solid #435774;border-radius:15px;box-shadow:0 35px 100px #000a}.modalhead{padding:20px 23px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modalhead h2{margin:0;font-size:19px}.modalbody{padding:23px}.sep{border:0;border-top:1px solid var(--line);margin:17px 0}.metric{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:12px 0;font-size:12px}.metric span{color:var(--muted)}.two{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.small{font-size:11px;color:var(--muted)}.result{padding:18px;background:#12392c;border:1px solid #246247;border-radius:11px;margin-top:15px}.result h3{margin:0 0 8px}.result p{font-size:12px;color:#b8e4cb}.notice{font-size:11px;color:#c1cbbb;background:#3a3522;padding:11px;border-radius:8px;margin-bottom:18px}@media(max-width:990px){.side{width:205px}.content{padding:27px 22px}.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.layout{display:block}.side{width:100%;height:auto;position:static;padding:14px;gap:10px}.brand{justify-content:center}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:10px}.side-info{display:none}.top{height:45px;padding:0 17px}.content{padding:22px 14px}.hrow{align-items:start;flex-direction:column}.hrow h1{font-size:29px}.cols,.grid,.form{grid-template-columns:1fr}.stats{gap:9px}.stat{padding:14px}.stat strong{font-size:24px}.banner{flex-direction:column;align-items:start}.full,.form-buttons{grid-column:auto}.modalbody{padding:15px}}
</style></head><body><div class="layout"><aside class="side"><div class="brand"><div class="brand-b">◎</div><div><strong>CAÇADOR<b>.IA</b></strong><small>INTELIGÊNCIA DE OFERTAS</small></div></div><nav class="nav" id="nav"></nav><div class="side-info"><b>Prévia offline</b><br/>Teste o painel sem instalar nada. Seus dados ficam neste navegador. A IA online e o Supabase funcionam no projeto Next.js incluso no ZIP.</div></aside><div class="main"><div class="top"><span>Workspace / <span id="location">Visão geral</span></span><span>● &nbsp; Modo demonstração</span></div><main id="main" class="content"></main></div></div><div id="modal-root"></div>
<script>
const STORE='cacador-demo-v1';const samples={products:[{id:'p1',name:'Mapas mentais de informática',niche:'Educação',type:'digital',price:47,cost:5,status:'researching',promise:'Aprender informática com mapas visuais organizados',audience:'Estudantes de tecnologia',notes:'Exemplo fictício para navegação.'},{id:'p2',name:'Pack de moldes para pets',niche:'Pets',type:'digital',price:29,cost:3,status:'ready',promise:'Moldes de roupas para pets',audience:'Pessoas que costuram para pets',notes:'Exemplo fictício para navegação.'},{id:'p3',name:'Desenhos infantis de colorir',niche:'Infantil',type:'digital',price:19,cost:1,status:'researching',promise:'Atividades para colorir em casa',audience:'Pais e professores',notes:'Exemplo fictício para navegação.'}],ads:[{id:'a1',productId:'p1',name:'Criativo demonstrativo 01',platform:'Meta',advertiser:'Concorrente ilustrativo',url:'',copy:'Aprenda com mapas mentais ilustrados.',hook:'Estudar não precisa ser difícil.',status:'unknown',favorite:false,seen:'2026-11-10',started:''},{id:'a2',productId:'p1',name:'Criativo demonstrativo 02',platform:'TikTok',advertiser:'Concorrente ilustrativo',url:'',copy:'Mapas visuais por matéria.',hook:'Organize seus estudos.',status:'unknown',favorite:false,seen:'2026-11-11',started:''},{id:'a3',productId:'p2',name:'Criativo demonstrativo 03',platform:'Meta',advertiser:'Concorrente ilustrativo',url:'',copy:'Modelos de roupas para pets.',hook:'Transforme tecido em roupas fofas.',status:'unknown',favorite:true,seen:'2026-11-10',started:''}],checks:[],tests:[]};
let data;try{data=JSON.parse(localStorage.getItem(STORE))||structuredClone(samples)}catch{data=structuredClone(samples)};let page='dashboard';let filter='';let productFilter='all';let comp=[];let editId=null;let modal='';let sim={pid:'p1',budget:120,cpc:1.2,cvr:1.5};
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const id=()=>`${Date.now()}-${Math.random().toString(36).slice(2,8)}`;const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(data))}catch{ /* navegação com armazenamento bloqueado: estado em memória */ }};const pr=pid=>data.products.find(p=>p.id===pid);const ads=pid=>data.ads.filter(a=>a.productId===pid);const score=p=>{let list=ads(p.id);return Math.min(100,list.length*8+(p.promise?12:0)+(p.audience?12:0)+(p.price?15:0)+(p.notes?6:0)+(p.cost!==undefined?10:0)+Math.min(21,list.filter(a=>a.started).length*7));};const status=s=>({'researching':'Pesquisando','ready':'Para testar','testing':'Em teste','winning':'Validado','discarded':'Descartado','active':'Ativo','inactive':'Inativo','unknown':'Não verificado'})[s]||s;const tag=s=>`<span class="tag ${['ready','winning','active'].includes(s)?'green':''}">${esc(status(s))}</span>`;const link=s=>{try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
const navItems=[['dashboard','◫','Visão geral'],['products','▦','Produtos'],['ads','▤','Biblioteca de anúncios'],['compare','⇄','Comparar ofertas'],['simulator','▧','Simulador']];
function go(p){page=p;filter='';render();window.scrollTo(0,0)}function header(title,desc,action=''){return `<div class="eyebrow">PAINEL DE INTELIGÊNCIA</div><div class="hrow"><div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}function empty(msg){return `<div class="empty"><strong>${esc(msg)}</strong>Cadastre um produto e comece a salvar anúncios.</div>`}
function render(){const names={dashboard:'Visão geral',products:'Produtos',ads:'Biblioteca de anúncios',compare:'Comparar ofertas',simulator:'Simulador'};$('location').textContent=names[page];$('nav').innerHTML=navItems.map(([key,icon,label])=>`<button onclick="go('${key}')" class="${page===key?'active':''}">${icon} &nbsp; ${label}</button>`).join('');$('main').innerHTML=({dashboard:dashboard,products:products,ads:adsPage,compare:compare,simulator:simulator})[page]();}
function dashboard(){const ranking=[...data.products].sort((a,b)=>score(b)-score(a));return header('Visão geral','Todas as oportunidades em um só lugar.',`<button class="btn primary" onclick="openProduct()">＋ Novo produto</button>`)+`<div class="notice">Dados iniciais demonstrativos, sem validação de mercado. Você pode apagá-los ou substituí-los por ofertas reais. Não há análise de IA nesta prévia.</div><div class="stats"><div class="stat"><small>Produtos monitorados</small><strong>${data.products.length}</strong><div class="hint">Pastas de oportunidades</div></div><div class="stat"><small>Anúncios salvos</small><strong>${data.ads.length}</strong><div class="hint">Criativos documentados</div></div><div class="stat"><small>Para testar</small><strong>${data.products.filter(p=>['ready','testing'].includes(p.status)).length}</strong><div class="hint">Produtos priorizados</div></div><div class="stat"><small>Anúncios favoritos</small><strong>${data.ads.filter(a=>a.favorite).length}</strong><div class="hint">Referências marcadas</div></div></div><div class="banner"><div><h3>Encontre uma oferta. Salve evidências. Decida com critérios.</h3><p>O ranking da demonstração mede dados informados, não lucro comprovado.</p></div><button class="btn primary" onclick="go('ads')">Ver biblioteca →</button></div><div class="cols"><div class="panel"><h2>Radar de oportunidades</h2><p class="description">Pontuação heurística de pesquisa (sem IA).</p>${ranking.map(p=>`<div class="row"><div class="left"><div class="symbol">◎</div><div><strong>${esc(p.name)}</strong><br/><small>${esc(p.niche)} · ${ads(p.id).length} anúncio(s)</small></div></div><span class="score">${score(p)}/100</span></div>`).join('')||empty('Sem produtos')}</div><div class="panel"><h2>Funil de pesquisa</h2><p class="description">Status que você controla.</p>${['researching','ready','testing','winning','discarded'].map(s=>`<div class="row">${tag(s)} <strong>${data.products.filter(p=>p.status===s).length}</strong></div>`).join('')}</div></div>`}
function products(){return header('Produtos monitorados','Cada produto tem seu acervo de anúncios e informações.',`<button class="btn primary" onclick="openProduct()">＋ Novo produto</button>`)+`<div class="toolbar"><input class="input" placeholder="Buscar produto ou nicho..." value="${esc(filter)}" oninput="search(this.value)"/><button class="btn" onclick="exportCsv('products')">↓ Exportar CSV</button></div><div class="grid">${data.products.filter(p=>(p.name+' '+p.niche).toLowerCase().includes(filter.toLowerCase())).map(p=>`<div class="card"><div class="flex between"><span class="tag">${esc(p.type)}</span>${tag(p.status)}</div><h3>${esc(p.name)}</h3><p>${esc(p.promise)}</p><div class="flex between"><strong>${money(p.price)}</strong><span class="score">${score(p)}/100</span></div><div class="foot"><small>${ads(p.id).length} anúncio(s)</small><a onclick="openProduct('${esc(p.id)}')">Editar →</a> <a onclick="removeProduct('${esc(p.id)}')" style="color:#e58d95">Excluir</a></div></div>`).join('')||empty('Nenhum produto encontrado')}</div>`}
function adsPage(){return header('Biblioteca de anúncios','Copies, links, ganchos e status verificados manualmente.',`<button class="btn primary" onclick="openAd()">＋ Salvar anúncio</button>`)+`<div class="toolbar"><input class="input" placeholder="Buscar anunciante, copy ou gancho..." value="${esc(filter)}" oninput="search(this.value)"/><select class="select" onchange="productFilter=this.value;render()"><option value="all">Todos os produtos</option>${data.products.map(p=>`<option value="${esc(p.id)}" ${productFilter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="grid">${data.ads.filter(a=>(productFilter==='all'||a.productId===productFilter)&&(a.name+' '+a.advertiser+' '+a.hook+' '+a.copy).toLowerCase().includes(filter.toLowerCase())).map(a=>`<div class="card"><div class="adpic">▤</div><div class="flex between"><span class="tag">${esc(a.platform)}</span>${tag(a.status)}</div><h3>${esc(a.name)}</h3><small>${esc(pr(a.productId)?.name||'Produto excluído')} · ${esc(a.advertiser)}</small><p>${esc(a.hook||a.copy)}</p><div class="foot"><a onclick="openAd('${esc(a.id)}')">Abrir / editar →</a><a onclick="toggleFavorite('${esc(a.id)}')">${a.favorite?'★ Favorito':'☆ Favoritar'}</a></div></div>`).join('')||empty('Nenhum anúncio encontrado')}</div>`}
function compare(){return header('Comparar oportunidades','Escolha até três produtos. O score não é previsão de vendas.')+`<div class="panel"><h2>Selecione os produtos</h2><p class="description">Marque produtos para colocar lado a lado.</p><div class="grid">${data.products.map(p=>`<label class="flex" style="padding:12px;border:1px solid #33435b;border-radius:9px"><input type="checkbox" ${comp.includes(p.id)?'checked':''} onchange="selectCompare('${esc(p.id)}',this.checked)"/> ${esc(p.name)}</label>`).join('')}</div></div><div class="grid">${data.products.filter(p=>comp.includes(p.id)).sort((a,b)=>score(b)-score(a)).map(p=>{let margin=p.price-p.cost;return `<div class="card"><div class="flex between">${tag(p.status)}<span class="score">${score(p)}/100</span></div><h3>${esc(p.name)}</h3><div class="metric"><span>Nicho</span><strong>${esc(p.niche)}</strong></div><div class="metric"><span>Anúncios</span><strong>${ads(p.id).length}</strong></div><div class="metric"><span>Preço de venda</span><strong>${money(p.price)}</strong></div><div class="metric"><span>Custo por venda</span><strong>${money(p.cost)}</strong></div><div class="metric"><span>Margem pré-mídia</span><strong>${money(margin)}</strong></div><div class="note">${esc(p.promise)}</div></div>`}).join('')}</div>`}
function simulator(){let p=pr(sim.pid)||data.products[0];if(p&&!sim.pid)sim.pid=p.id;const clicks=Number(sim.cpc)>0?Number(sim.budget)/Number(sim.cpc):0,sales=clicks*Number(sim.cvr)/100,profit=sales*((p?.price||0)-(p?.cost||0))-Number(sim.budget);return header('Simulador de testes','Faça contas de hipótese antes de investir.')+`<div class="cols"><div class="panel"><h2>Hipóteses de tráfego</h2><p class="description">Altere os campos e veja o cenário hipotético.</p><div class="form"><label class="field full">Produto<select class="select" onchange="sim.pid=this.value;render()">${data.products.map(q=>`<option value="${esc(q.id)}" ${p?.id===q.id?'selected':''}>${esc(q.name)}</option>`).join('')}</select></label><label class="field">Orçamento (R$)<input type="number" min="0" class="input" value="${esc(sim.budget)}" oninput="sim.budget=this.value;render()"/></label><label class="field">CPC estimado (R$)<input type="number" min="0.01" step="0.01" class="input" value="${esc(sim.cpc)}" oninput="sim.cpc=this.value;render()"/></label><label class="field full">Conversão hipotética (%)<input type="number" min="0" max="100" step="0.1" class="input" value="${esc(sim.cvr)}" oninput="sim.cvr=this.value;render()"/></label></div><div class="result"><h3>Cenário calculado</h3><div class="metric"><span>Cliques</span><strong>${clicks.toFixed(0)}</strong></div><div class="metric"><span>Vendas esperadas</span><strong>${sales.toFixed(1)}</strong></div><div class="metric"><span>Receita</span><strong>${money(sales*(p?.price||0))}</strong></div><div class="metric"><span>Resultado variável</span><strong style="color:${profit>=0?'#5ef0b8':'#ffb1ba'}">${money(profit)}</strong></div></div></div><div class="panel"><h2>Como interpretar</h2><p class="description">Este cálculo não é previsão.</p><div class="note">O custo por clique e a taxa de conversão são hipóteses suas. O resultado considera preço e custo informado, menos o valor do anúncio. Não inclui custos fixos e reembolsos.</div><button class="btn primary" style="margin-top:16px" onclick="go('products')">Ver meus produtos →</button></div></div>`}
function search(v){filter=v;const pos=document.activeElement?.selectionStart;render();const input=$('main').querySelector('.toolbar input');if(input){input.focus();try{input.setSelectionRange(pos,pos)}catch{}}}
function selectCompare(pid,checked){comp=checked?[...comp.filter(x=>x!==pid),pid].slice(-3):comp.filter(x=>x!==pid);render()}
function modalWindow(title,body){$('modal-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="btn" onclick="closeModal()">✕</button></div><div class="modalbody">${body}</div></div></div>`}
function closeModal(){$('modal-root').innerHTML=''}
function openProduct(pid){let p=pr(pid)||{id:'',name:'',niche:'',type:'digital',price:'',cost:'',status:'researching',promise:'',audience:'',notes:''};modalWindow(pid?'Editar produto':'Novo produto',`<form class="form" onsubmit="saveProduct(event,'${esc(p.id)}')"><label class="field">Produto *<input name="name" class="input" required value="${esc(p.name)}"/></label><label class="field">Nicho<input name="niche" class="input" value="${esc(p.niche)}"/></label><label class="field">Tipo<select name="type" class="select">${['digital','physical','saas','service'].map(x=>`<option ${x===p.type?'selected':''} value="${x}">${x}</option>`).join('')}</select></label><label class="field">Status<select name="status" class="select">${['researching','ready','testing','winning','discarded'].map(x=>`<option ${x===p.status?'selected':''} value="${x}">${status(x)}</option>`).join('')}</select></label><label class="field">Preço (R$)<input name="price" type="number" min="0" step="0.01" class="input" value="${esc(p.price)}"/></label><label class="field">Custo por venda (R$)<input name="cost" type="number" min="0" step="0.01" class="input" value="${esc(p.cost)}"/></label><label class="field full">Promessa<textarea name="promise" class="area">${esc(p.promise)}</textarea></label><label class="field full">Público-alvo<input name="audience" class="input" value="${esc(p.audience)}"/></label><label class="field full">Notas<textarea name="notes" class="area">${esc(p.notes)}</textarea></label><div class="form-buttons"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button type="submit" class="btn primary">Salvar produto</button></div></form>`)}
function saveProduct(e,pid){e.preventDefault();const f=new FormData(e.target);const val=k=>String(f.get(k)||'').trim();const item={id:pid||id(),name:val('name'),niche:val('niche'),type:val('type'),price:Number(val('price')),cost:Number(val('cost')),status:val('status'),promise:val('promise'),audience:val('audience'),notes:val('notes')};if(pid)data.products=data.products.map(p=>p.id===pid?item:p);else data.products.push(item);save();closeModal();go('products')}
function removeProduct(pid){if(!confirm('Excluir produto e seus anúncios nesta demonstração?'))return;data.products=data.products.filter(p=>p.id!==pid);data.ads=data.ads.filter(a=>a.productId!==pid);save();render()}
function openAd(aid){let a=data.ads.find(x=>x.id===aid)||{id:'',name:'',productId:data.products[0]?.id||'',platform:'Meta',advertiser:'',url:'',copy:'',hook:'',status:'unknown',favorite:false,seen:new Date().toISOString().slice(0,10),started:''};if(!data.products.length){alert('Cadastre um produto primeiro.');return}modalWindow(aid?'Editar anúncio':'Salvar anúncio',`<form class="form" onsubmit="saveAd(event,'${esc(a.id)}')"><label class="field">Produto *<select name="productId" class="select">${data.products.map(p=>`<option value="${esc(p.id)}" ${p.id===a.productId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label class="field">Nome do criativo *<input name="name" class="input" required value="${esc(a.name)}"/></label><label class="field">Plataforma<select class="select" name="platform">${['Meta','TikTok','Google','YouTube','Outra'].map(x=>`<option ${a.platform===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Anunciante<input class="input" name="advertiser" value="${esc(a.advertiser)}"/></label><label class="field full">Link original da Biblioteca da Meta<input name="url" id="demo-meta-url" class="input" type="url" value="${esc(a.url)}" placeholder="https://www.facebook.com/ads/library/?id=..."/></label><div class="full"><button type="button" class="btn primary" onclick="demoInspectLink()">🔎 Identificar link da Meta</button><div class="note" id="demo-check-result" style="margin-top:10px">Se o anúncio não estiver disponível, você poderá salvar e completar os dados manualmente. Esta prévia offline não acessa a Meta.</div></div><label class="field full">Gancho<input name="hook" class="input" value="${esc(a.hook)}"/></label><label class="field full">Copy<textarea name="copy" class="area">${esc(a.copy)}</textarea></label><label class="field">Data de início (se pública)<input name="started" type="date" class="input" value="${esc(a.started)}"/></label><label class="field">Status observado<select name="status" class="select">${['unknown','active','inactive'].map(x=>`<option value="${x}" ${a.status===x?'selected':''}>${status(x)}</option>`).join('')}</select></label><div class="form-buttons">${aid?`<button class="btn danger" type="button" onclick="removeAd('${esc(a.id)}')">Excluir</button>`:''}<button type="button" class="btn" onclick="closeModal()">Cancelar</button><button type="submit" class="btn primary">Salvar anúncio</button></div></form>`)}
function demoInspectLink(){
  const input=$('demo-meta-url'),box=$('demo-check-result');let u;
  try{u=new URL(input.value.trim());}catch{box.textContent='⚠ Cole uma URL completa da Biblioteca de Anúncios da Meta. Preencha manualmente se necessário.';return}
  if(u.protocol!=='https:'||!['facebook.com','www.facebook.com','business.facebook.com','m.facebook.com'].includes(u.hostname.toLowerCase())||!/^\/ads\/library\/?$/.test(u.pathname)){
    box.textContent='⚠ Não é um link da Biblioteca da Meta. Você ainda pode salvar a referência manualmente.';return;
  }
  const adId=u.searchParams.get('id');
  if(!adId||!/^\d{7,25}$/.test(adId)){box.textContent='⚠ Este link não identifica um anúncio individual. Abra os detalhes do anúncio e copie o link com ?id=... ou complete manualmente.';return}
  input.value='https://www.facebook.com/ads/library/?id='+adId;
  if(!document.querySelector('input[name="name"]').value)document.querySelector('input[name="name"]').value='Anúncio Meta #'+adId;
  box.textContent='✓ ID '+adId+' encontrado no link. ⚠ A página pública não pode ser consultada nesta prévia offline: informe data de início, status, texto e print manualmente. Na versão online, o servidor tentará a consulta e registrará o histórico.';
}
function saveAd(e,aid){e.preventDefault();let f=new FormData(e.target),val=k=>String(f.get(k)||'').trim();let old=data.ads.find(x=>x.id===aid);let item={id:aid||id(),productId:val('productId'),name:val('name'),platform:val('platform'),advertiser:val('advertiser'),url:link(val('url')),copy:val('copy'),hook:val('hook'),started:val('started'),status:val('status'),favorite:old?.favorite||false,seen:old?.seen||new Date().toISOString().slice(0,10)};if(aid)data.ads=data.ads.map(a=>a.id===aid?item:a);else data.ads.push(item);save();closeModal();go('ads')}
function toggleFavorite(aid){let a=data.ads.find(x=>x.id===aid);if(a){a.favorite=!a.favorite;save();render()}}
function removeAd(aid){if(!confirm('Excluir anúncio?'))return;data.ads=data.ads.filter(x=>x.id!==aid);save();closeModal();render()}
function exportCsv(kind){let arr=data[kind]||[];if(!arr.length)return alert('Sem registros.');let cols=Object.keys(arr[0]);let csv='\ufeff'+[cols,...arr.map(x=>cols.map(k=>String(x[k]??'').replaceAll('"','""')))].map(row=>row.map(v=>'"'+v+'"').join(';')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=kind+'.csv';a.click();URL.revokeObjectURL(u)}
render();
</script></body></html>
