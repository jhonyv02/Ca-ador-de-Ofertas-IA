name: Validar SaaS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validacao:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_test_build_only"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Instalar dependencias do lockfile
        run: npm ci --no-audit --no-fund
      - name: Testar extrator Meta
        run: npm run test:meta
      - name: Verificar TypeScript
        run: npm run lint
      - name: Compilar Next.js para producao
        run: npm run build
