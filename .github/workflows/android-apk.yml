name: Gerar APK Android - Caçador de Ofertas IA

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK Android
        run: gradle -p android --no-daemon assembleDebug

      - name: Validar e nomear APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Cacador-de-Ofertas-IA-Android-v1.0.apk
          test -s Cacador-de-Ofertas-IA-Android-v1.0.apk
          unzip -l Cacador-de-Ofertas-IA-Android-v1.0.apk | grep -q classes.dex

      - name: Disponibilizar APK no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Cacador-de-Ofertas-IA-Android-v1.0
          path: Cacador-de-Ofertas-IA-Android-v1.0.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publicar APK instalável em Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="cacador-android-v1.0.0"
          ASSET="Cacador-de-Ofertas-IA-Android-v1.0.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "Caçador de Ofertas IA para Android v1.0" \
              --notes "APK de instalação direta para Android 8+. Abre o Caçador hospedado na Hostinger; conexão com a internet necessária. Construção assinada para testes (debug); não é um lançamento na Play Store. Como a chave de assinatura de teste pode mudar entre builds, uma atualização futura poderá exigir desinstalação anterior."
          fi
