name: Validar estudio de paginas IA
on:
  push:
    branches: [main]
    paths:
      - 'lib/sales-page.ts'
      - 'lib/page-winner.ts'
      - 'lib/reference-sales-page.ts'
      - 'lib/sales-page-visuals.ts'
      - 'tests/page-winner.test.mjs'
      - 'tests/reference-sales-page.test.mjs'
      - 'app/**/remodelar/page.tsx'
      - 'app/api/remodel-page/route.ts'
      - 'app/api/sales-visual/route.ts'
      - '.github/workflows/validar-estudio-paginas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: 'https://example.supabase.co'
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_test_build_only'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run test:meta
      - run: npm run lint
      - run: npm run build
